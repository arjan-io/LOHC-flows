<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Doorzoekbare proceswijzer voor vrijwilligers en medewerkers van LOHC."
    />
    <title>LOHC Proceswijzer</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=20260702-11" />
    <script type="module" src="app.js?v=20260703-1"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Naar de inhoud</a>
    <header class="site-header">
      <a class="brand" href="#/" aria-label="LOHC Proceswijzer home">
        <span class="brand-mark" aria-hidden="true"><img src="assets/logo-lohc.svg?v=1" alt=""></span>
        <span>
          <strong>LOHC</strong>
          <small data-i18n="brandSubtitle">Proceswijzer</small>
        </span>
      </a>
      <nav class="header-actions" aria-label="Hulpmiddelen">
        <button class="language-toggle" id="language-toggle" type="button" aria-label="Switch to English">
          <span class="language-option is-active" data-language-label="nl">NL</span>
          <span aria-hidden="true">/</span>
          <span class="language-option" data-language-label="en">EN</span>
        </button>
        <span class="help-link">
          <span aria-hidden="true">?</span>
          <span data-i18n="help">Hulp nodig?</span>
        </span>
      </nav>
    </header>

    <main id="main"></main>

    <footer>
      <p data-i18n="footer">LOHC Proceswijzer · Samen houden we de club draaiend</p>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
